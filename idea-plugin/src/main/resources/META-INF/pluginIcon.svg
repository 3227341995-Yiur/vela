<?xml version="1.0" encoding="UTF-8"?>
<!--
  The plugin's own icon (the 40x40 the platform asks for in META-INF): the file
  icon's mark, larger, with the two things Vela is for written where the letters
  would be — a proof tick inside the V.

  It is generated here rather than shipped as a bitmap so that it stays sharp at
  every scale the IDE renders it at, and so that changing the language's colours
  is a one-line edit instead of a redraw.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="velaBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B3E86"/>
      <stop offset="100%" stop-color="#20224A"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="38" height="38" rx="9"
        fill="url(#velaBody)" stroke="#7B88FF" stroke-width="1.5"/>
  <path d="M9.5 11 L18.2 28.5 L25.5 14"
        fill="none" stroke="#F2F4FF" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14.5 31.5 L18 35 L27.5 25.5"
        fill="none" stroke="#4ADEDE" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
